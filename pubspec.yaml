name: hertzhound
description: >-
  Dart & Flutter: find the real audio format (WAV, FLAC, MP3, AIFF, M4A) and
  exact duration from bytes when a lying extension shows the wrong duration or
  plays silence.
version: 0.1.0
homepage: https://github.com/saimskywalker/hertzhound
repository: https://github.com/saimskywalker/hertzhound
issue_tracker: https://github.com/saimskywalker/hertzhound/issues
topics:
  - audio
  - flutter
  - wav
  - mp3
  - flac

environment:
  sdk: ^3.8.0

executables:
  hertzhound: hertzhound
dev_dependencies:
  lints: '>=5.0.0 <7.0.0'
  test: ^1.25.0
