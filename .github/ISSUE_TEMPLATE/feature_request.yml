name: Feature request
description: Suggest a format, a container layout or an API this package should support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to detect or measure, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Specification
      description: For a new format or layout, the public specification it is defined in.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      render: dart
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: ai-use
    attributes:
      label: Did you use an AI tool to write this issue?
      options:
        - "No"
        - "Yes, for parts"
        - "Yes, mostly"
    validations:
      required: true
  - type: input
    id: ai-tool
    attributes:
      label: If yes, which tool and model?
      description: Required if you answered yes above, for example "Claude Code, Opus 5.5" or "Copilot, GPT-5".
  - type: checkboxes
    id: own-words
    attributes:
      label: Your own words
      description: Please write the issue in your own words; short and plain is fine. It shows us what you understood. Please don't paste generated text.
      options:
        - label: I wrote this issue in my own words.
